# Boltrex — pruebas UNITARIAS del backend (mantenimiento fase 7, P2.23).
#   backend/.venv/bin/python -m pytest          (desde la raíz del repo; ~2 s, sin Mongo ni backend)
# Solo tests/unit: las baterías de integración (tests/*_check.py) corren con scripts/run_all_tests.sh.
[pytest]
testpaths = tests/unit
pythonpath = backend
addopts = -q -p no:cacheprovider
filterwarnings =
    # Aviso de starlette 0.37 sobre python-multipart (librería externa; desaparece al actualizar fastapi).
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
