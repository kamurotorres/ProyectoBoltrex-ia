version: "3.8"

services:
  mongo:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - mongo
    # Montar el archivo de entorno para que server.py pueda leer backend/.env
    volumes:
      - ./backend/.env:/app/.env:ro
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: always

volumes:
  mongo_data: