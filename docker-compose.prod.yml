# Boltrex — PRODUCCIÓN (Hostinger VPS). Se usa junto con docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Solo Caddy publica puertos (80/443). Mongo, backend y frontend quedan en la red interna.
# Guía completa: memorias_claude/DESPLIEGUE_HOSTINGER.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    # Detrás de Caddy: nginx toma la IP real del cliente de X-Forwarded-For (límite de login por IP).
    volumes:
      - ./deploy/nginx/realip.conf:/etc/nginx/snippets/realip.conf:ro

  # HTTPS automático (Let's Encrypt) y redirección de HTTP a HTTPS.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env (p. ej. boltrex.online)}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env (correo para Let's Encrypt)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    logging: *default-logging

  # Respaldo diario de MongoDB (+ copia a Google Drive con rclone si está configurado).
  backup:
    build:
      context: deploy/backup
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-boltrex}
      TZ: ${TZ:-America/Bogota}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_KEEP_DAYS: ${RCLONE_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      # Carpeta con rclone.conf (credenciales de Google Drive). Sin el archivo, no se sube nada.
      - ./deploy/backup/rclone:/config/rclone
    mem_limit: 512m
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
