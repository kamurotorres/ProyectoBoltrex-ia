# Boltrex (P2.25) — solo en producción, detrás de Caddy (montado por docker-compose.prod.yml).
# El frontend no publica puertos en producción: solo Caddy (red interna de Docker) le habla, así
# que se confía en las IPs privadas y se toma la IP real del cliente de X-Forwarded-For.
# Sin esto, el límite de intentos por equipo (P1.9) vería a todos con la IP de Caddy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
