# Boltrex — Integración continua (backlog P2.24)
#
# Corre en cada push a cualquier rama y en cada Pull Request a main (decisión 1A).
# main no está protegida (decisión 2A): antes de mezclar una rama se revisa que su CI esté en ✅.
# Lint solo de errores reales (decisión 3A): sintaxis, nombres sin definir e imports que no existen.
#
# Trabajos en paralelo:
#   backend   → lint + pruebas unitarias (pytest, fase 7) + las baterías de integración contra Mongo 6 (replica set)
#   frontend  → mapa de permisos del menú + build de la imagen Docker del frontend
#   imagenes  → build de la imagen Docker del backend (la que se desplegaría en el VPS)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + pruebas unitarias + integración)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Mongo de prueba sin contraseña, solo dentro de la máquina del CI.
      MONGO_URL: mongodb://localhost:27017/?directConnection=true
      BOLTREX_ADMIN_PASSWORD: Prueba-Admin-2026
      JWT_SECRET_KEY: ci-solo-para-pruebas-no-es-un-secreto-real
      BOLTREX_TEST_LOGS: ${{ github.workspace }}/.test-logs
    steps:
      - uses: actions/checkout@v4

      - name: Mongo 6 en modo replica set (lo necesitan las transacciones)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:6.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "printjson(db.hello().isWritablePrimary)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # la misma de backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias del backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements-dev.txt   # producción + pruebas/lint

      - name: Lint (solo errores reales)
        run: |
          # E9 sintaxis · F63/F7 errores de lógica de Python · F82 nombres sin definir
          backend/.venv/bin/ruff check --select E9,F63,F7,F82 --output-format github backend scripts tests
          # Que el backend arranque sus imports (detecta módulos o funciones que no existen)
          cd backend && DB_NAME=boltrex_importtest ../backend/.venv/bin/python -c "import main; print('Backend importa OK:', len(main.app.routes), 'rutas')"

      - name: Pruebas unitarias (pytest — reglas de core/ y de arquitectura, sin Mongo)
        run: backend/.venv/bin/python -m pytest --junitxml=.test-logs/unit.xml

      - name: Pruebas de integración (baterías contra Mongo)
        run: BOLTREX_SKIP_UNIT=1 scripts/run_all_tests.sh

      - name: Logs de las pruebas (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pruebas
          path: .test-logs/
          retention-days: 7

  frontend:
    name: Frontend (permisos del menú + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"              # la misma de frontend/Dockerfile

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install ajv ajv-keywords --legacy-peer-deps --no-audit --no-fund

      - name: Mapa de permisos del menú
        run: node tests/frontend_access_check.js

      - name: Sintaxis, imports y texto JSX suelto (todo src/)
        run: node tests/frontend_syntax_check.js

      - name: Formatos de dinero y fechas (lib/format.js)
        run: node tests/frontend_format_check.js

      - name: Reglas del carrito del POS vs. el código original
        run: node tests/frontend_cart_check.js

      - name: Reglas de los formularios (zod) vs. backend y versión original
        run: node tests/frontend_forms_check.js

      - name: Formularios renderizados (jsdom) — errores bajo cada campo y datos enviados
        run: node tests/frontend_forms_render_check.js

      - name: Lint (nombres sin definir)
        run: bash tests/frontend_lint_check.sh

      - name: Build de la imagen Docker del frontend
        run: docker build -t boltrex-frontend:ci -f frontend/Dockerfile .

      - name: nginx acepta la configuración (normal y con IP real para túnel / producción)
        run: |
          # --add-host: nginx resuelve "backend" al cargar la configuración.
          docker run --rm --add-host backend:127.0.0.1 boltrex-frontend:ci nginx -t
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/deploy/nginx/realip.conf:/etc/nginx/snippets/realip.conf:ro" boltrex-frontend:ci nginx -t

  imagenes:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen Docker del backend
        run: docker build -t boltrex-backend:ci -f backend/Dockerfile .
      - name: La imagen arranca (importa la app)
        run: docker run --rm -e DB_NAME=boltrex_importtest boltrex-backend:ci python -c "import main; print('OK', len(main.app.routes), 'rutas')"
